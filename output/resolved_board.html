<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Customs — resolved board</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px 64px;
      background: #f3efe8;
      color: #1c1915;
      font: 16px/1.5 Georgia, serif;
    }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0 0 24px; color: #5c564c; }
    figure { margin: 0 0 28px; }
    img { width: 100%; height: auto; border-radius: 16px; display: block; }
    figcaption { margin-top: 8px; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Resolved board</h1>
    <p>The React desk after tickets 101, 102, and 103 were resolved. Checking is $3,400.00 on each shot.</p>
    <figure>
      <img src="board-101.png" alt="React desk with ticket 101, the Bulldog tee, selected and resolved.">
      <figcaption>Ticket 101 — Bulldog tee. Resolved. Invoice 501 is ready for approval.</figcaption>
    </figure>
    <figure>
      <img src="board-102.png" alt="React desk with ticket 102, rent due, selected and resolved.">
      <figcaption>Ticket 102 — Rent due. Resolved. Lease 1 is ready for approval.</figcaption>
    </figure>
    <figure>
      <img src="board-103.png" alt="React desk with ticket 103, the bulk hoodie discount, selected and resolved.">
      <figcaption>Ticket 103 — Bulk hoodie discount. Resolved. No payment button, because there is no bill.</figcaption>
    </figure>
  </main>
</body>
</html>
